[tool.poetry]
name = "podcastfy"
version = "0.4.1"
description = "An Open Source alternative to NotebookLM's podcast feature: Transforming Multimodal Content into Captivating Multilingual Audio Conversations with GenAI"
authors = ["Tharsis T. P. Souza"]
license = "Apache-2.0"
readme = "README.md"
include = [
    "podcastfy/config.yaml",
    "podcastfy/conversation_config.yaml"
]

[tool.poetry.dependencies]
python = "^3.11"
typer = "^0.12.5"
python-dotenv = "^1.0.1"
requests = "^2.32.3"
openai = "^1.51.0"
elevenlabs = "^1.9.0"
pyyaml = "^6.0.2"
pydub = "^0.25.1"
google-generativeai = "^0.8.2"
langchain = "^0.3.3"
langchain-google-genai = "^2.0.1"
edge-tts = "^7.2.3"
nest-asyncio = "^1.6.0"
azure-cognitiveservices-speech = "^1.40.0"
google-cloud-texttospeech = "^2.33.0"
litellm = "^1.52.0"
langchain-community = "^0.3.5"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
black = "^24.8.0"
sphinx = ">=8.0.2"
sphinx-rtd-theme = "^3.0.1"
nbsphinx = "^0.9.5"
ipykernel = "^6.29.5"
mypy = "^1.11.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
build_docs = "build_docs:main"



